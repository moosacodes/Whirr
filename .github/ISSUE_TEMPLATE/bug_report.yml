name: Bug report
description: Report a reproducible defect without including secrets or personal data.
title: '[Bug] '
labels: ['type:bug']
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities must be reported privately through the Security
        tab, not in this public form. See SECURITY.md.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken, and who is affected?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Exact steps, starting from a clean checkout where possible.
      placeholder: |
        1. npm ci
        2. npm run setup
        3. npm run dev
        4. Open ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error and sanitized logs. Remove cookies, tokens, keys, and private identifiers.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, browser, and commit SHA.
      placeholder: Windows 11, Node 24.x, Chromium, commit SHA
    validations:
      required: true

  - type: checkboxes
    id: boundaries
    attributes:
      label: Data safety
      options:
        - label: I removed secrets, cookies, private keys, raw audio, and personal data from this report.
          required: true
        - label: This is not a security vulnerability; those are reported privately.
          required: true
